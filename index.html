<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple & Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Calculator Pro</h1>
        <p>Simple and Scientific Calculators</p>
    </header>

    <main class="calculator">
        <div class="tabs">
            <button id="simpleTab" class="active">Simple</button>
            <button id="scientificTab">Scientific</button>
        </div>

        <input id="display" type="text" value="0"
               aria-label="Calculator display" readonly>

        <div class="buttons">
            <button class="special" data-action="clear">AC</button>
            <button class="special" data-action="delete">DEL</button>
            <button class="special" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-action="sign">+/-</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="equals">=</button>
        </div>

        <div id="scientificButtons" class="scientific-buttons hidden">
            <button data-value="sin(">sin</button>
            <button data-value="cos(">cos</button>
            <button data-value="tan(">tan</button>
            <button data-value="sqrt(">√</button>
            <button data-value="log(">log</button>
            <button data-value="ln(">ln</button>
            <button data-value="^">xʸ</button>
            <button data-value="(">(</button>
            <button data-value=")">)</button>
            <button data-value="pi">π</button>
            <button data-value="e">e</button>
            <button data-value="abs(">abs</button>
        </div>

        <p class="note">Scientific trigonometry uses degrees.</p>
    </main>

    <footer>Calculator Pro | HTML • CSS • JavaScript</footer>

    <script src="script.js"></script>
</body>
</html>
